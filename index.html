<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>CryptoMine Admin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .status {
      padding: 15px;
      border-radius: 14px;
      background: #111827;
      border: 1px solid #1e293b;
      margin-bottom: 20px;
    }

    .status span {
      color: #22c55e;
      font-weight: bold;
    }

    .panel {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 19px;
      margin-bottom: 10px;
    }

    .panel p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>🛡️ CryptoMine Admin</h1>
      <p>Panel administrativo seguro</p>
    </header>

    <section class="status">
      Estado: <span>Conectando...</span>
    </section>

    <section class="panel">
      <h2>💰 Gestión de retiros</h2>

      <p>
        Este panel permitirá revisar y autorizar
        retiros de CryptoMine.
      </p>
    </section>

  </main>

</body>
</html>
